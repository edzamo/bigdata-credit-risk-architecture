name: bigdata-credit-risk

networks:
  bigdata-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  metabase-data:

services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: bigdata-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bigdata_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bigdata_password_change_me}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - minio-data:/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: bigdata-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - bigdata-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-bigdata_admin} ${MINIO_ROOT_PASSWORD:-bigdata_password_change_me} &&
      mc mb -p local/bronze local/silver local/gold &&
      echo 'Buckets bronze/silver/gold listos'
      "

  postgres:
    image: postgres:16-alpine
    container_name: bigdata-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigdata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
    ports:
      - "9432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigdata_admin} -d ${POSTGRES_DB:-credit_risk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  adminer:
    image: adminer:4-standalone
    container_name: bigdata-adminer
    depends_on:
      - postgres
    ports:
      - "9080:8080"
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  spark-processing:
    build:
      context: ./docker/spark-processing
    container_name: bigdata-spark-processing
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPARK_LOCAL_CORES: ${SPARK_LOCAL_CORES:-2}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bigdata_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bigdata_password_change_me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata_password_change_me}
    ports:
      - "9040:4040"   # Spark UI (driver, modo local)
    volumes:
      - .:/opt/app
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    tty: true
    stdin_open: true

  pipeline-runner:
    build:
      context: ./docker/spark-processing
    container_name: bigdata-pipeline-runner
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPARK_LOCAL_CORES: ${SPARK_LOCAL_CORES:-2}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bigdata_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bigdata_password_change_me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata_password_change_me}
      CREDIT_CSV_PATH: ${CREDIT_CSV_PATH:-/opt/app/data/raw/application_train.csv}
    command: ["python", "run_pipeline.py"]
    volumes:
      - .:/opt/app
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    restart: "no"

  metabase:
    image: metabase/metabase:v0.58-lts
    container_name: bigdata-metabase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Metabase guarda su propio metadata (dashboards, preguntas, usuarios) en un archivo H2
      # embebido, separado del Postgres del negocio (que solo tiene KPIs de Gold) — así no se
      # mezcla la app de BI con los datos del pipeline.
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "9030:3000"   # Dashboard Metabase (Capa 6 · Consumo, alternativa open source a Power BI)
    volumes:
      - metabase-data:/metabase-data
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"

  jupyter:
    build:
      context: ./docker/spark-processing
    container_name: bigdata-jupyter
    depends_on:
      - spark-processing
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --NotebookApp.token='' --NotebookApp.password=''
      --notebook-dir=/opt/app/notebooks
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bigdata_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bigdata_password_change_me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata_password_change_me}
    ports:
      - "9888:8888"
    volumes:
      - .:/opt/app
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
